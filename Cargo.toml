[workspace]
members = [
    "crates/codeswarm-adapters",
    "crates/codeswarm-cli",
    "crates/codeswarm-core",
    "crates/codeswarm-transcript",
    "crates/codeswarm-tui",
]
resolver = "2"

[workspace.package]
version = "0.6.43"
edition = "2024"
license = "AGPL-3.0-only"
authors = ["CodeSwarm contributors"]
repository = "https://github.com/HainanZhao/codeswarm"
description = "A full-screen terminal workspace for collaborating coding agents"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.dependencies]
async-trait = "0.1.89"
base64 = "0.22.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
tokio = { version = "1.49.0", features = ["io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
crossterm = "0.29.0"
nix = { version = "0.29.0", features = ["process", "signal"] }
ratatui = "0.30.0"
time = { version = "0.3.55", features = ["local-offset"] }

[profile.release]
codegen-units = 1
lto = "thin"
