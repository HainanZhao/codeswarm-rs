[workspace]
members = [".", "crates/codeswarm-adapters"]
resolver = "2"

[workspace.package]
version = "0.9.5"
edition = "2024"
license = "MIT"
authors = ["CodeSwarm contributors"]
repository = "https://github.com/HainanZhao/codeswarm-rs"
description = "A full-screen terminal workspace for collaborating coding agents"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.dependencies]
async-trait = "0.1.89"
base64 = "0.22.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
tokio = { version = "1.49.0", features = ["io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
crossterm = "0.29.0"
futures = "0.3.31"
nix = { version = "0.29.0", features = ["process", "signal"] }
ratatui = "0.30.0"
time = { version = "0.3.55", features = ["local-offset"] }
tui-textarea-2 = { version = "0.13.2", default-features = false, features = ["ratatui", "crossterm"] }

[package]
name = "codeswarm"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description.workspace = true
exclude = [".venv/**", "crates/codeswarm-adapters/**"]

[[bin]]
name = "codeswarm"
path = "crates/codeswarm-cli/src/main.rs"

[dependencies]
codeswarm-adapters = { version = "=0.9.5", path = "crates/codeswarm-adapters" }
crossterm.workspace = true
ratatui.workspace = true
serde_json.workspace = true
sha2.workspace = true
time.workspace = true
tokio.workspace = true
tui-textarea-2.workspace = true

[dev-dependencies]
async-trait.workspace = true

[lints]
workspace = true

[profile.release]
codegen-units = 1
lto = "thin"
