name: Bug Report
description: Report a bug or issue
title: "Bug: "
labels: ["bug"]
body:
  - type: textarea
    id: bug-description
    attributes:
      label: Bug Description
      description: Describe the bug you encountered
      placeholder: |
        What happened?
        What did you expect to happen?
        Steps to reproduce...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: CodeSwarm version
      placeholder: codeswarm --version
    validations:
      required: true
